version: "3.9"

services:

  server:
    build: ./server
    container_name: trello-server

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    restart: unless-stopped

    networks:
      - trello-net


  client:
    build: ./client
    container_name: trello-client

    ports:
      - "5173:3000"

    depends_on:
      - server

    restart: unless-stopped

    networks:
      - trello-net
   
   

networks:
  trello-net:
    driver: bridge