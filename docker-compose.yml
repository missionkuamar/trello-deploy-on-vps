version: "3.9"

services:

  server:
    build: ./server
    container_name: express-server

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    restart: unless-stopped

    networks:
      - fullstack-net


  client:
    build: ./client
    container_name: react-client

    ports:
      - "5173:3000"

    depends_on:
      - server

    restart: unless-stopped

    networks:
      - fullstack-net


networks:
  fullstack-net:
    driver: bridge